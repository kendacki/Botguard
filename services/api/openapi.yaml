openapi: 3.0.3
info:
  title: BOTGUARD API
  version: "1.0.0"
  description: >
    Off-chain API layer for BOTGUARD, the compliance credential registry for
    BOT Chain RWA applications. Other platforms call GET /status/{wallet} to
    confirm a wallet is verified and to read the verification kind (tier +
    region). Identity documents never leave the issuer.

servers:
  - url: https://botguard-production-7c4d.up.railway.app
    description: BOT Chain Testnet API
  - url: http://localhost:8080
    description: Local

security:
  - ApiKeyAuth: []

paths:
  /verifications:
    post:
      summary: Submit a new verification request for a holder
      description: >
        Called by an approved issuer's backend after they complete their own
        KYC flow. Body carries only a hash commitment and tier/jurisdiction,
        never raw identity data. Prefer requiring an ESCROWED fee first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationSubmission'
      responses:
        '202':
          description: Accepted, queued for on-chain issuance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequestStatus'
        '400':
          description: Malformed submission
        '401':
          description: Invalid or missing API key
        '403':
          description: Issuer not active on IssuerRegistry
        '429':
          description: Rate limit exceeded, see Retry-After header

  /verifications/fee:
    get:
      summary: Current on-chain verification fee
      security: []
      responses:
        '200':
          description: Fee amount in wei and human BOT units

  /verifications/fee-status/{holderAddress}:
    get:
      summary: Escrowed fee status for a holder
      security: []
      parameters:
        - name: holderAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fee escrow status
        '404':
          description: No fee status on record

  /verifications/{holderAddress}/reject:
    post:
      summary: Reject a pending verification and refund escrowed fee
      parameters:
        - name: holderAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refund submitted
        '400':
          description: Reject failed
        '401':
          description: Invalid or missing API key

  /verifications/{requestId}:
    get:
      summary: Poll verification request status
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequestStatus'
        '404':
          description: Not found

  /status/{holderAddress}:
    get:
      summary: Public check — is this wallet verified, and what kind of check was it?
      description: >
        For other platforms. No API key. Returns whether the wallet is currently
        cleared, the verification kind (tier + region), and whether it meets an
        optional minimum tier / jurisdiction. Missing, expired, and revoked
        wallets return verified=false with HTTP 200. Personal data is never included.
      security: []
      parameters:
        - name: holderAddress
          in: path
          required: true
          schema:
            type: string
        - name: minTier
          in: query
          required: false
          schema:
            type: string
            enum: [RETAIL, ACCREDITED, INSTITUTIONAL]
          description: Default RETAIL. meetsRequirement is false if the pass is below this tier.
        - name: jurisdiction
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
          description: Optional ISO region. If set, meetsRequirement also requires a matching region.
      responses:
        '200':
          description: Status for this wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletStatus'
        '400':
          description: Invalid address or minTier

  /credentials/{holderAddress}:
    get:
      summary: Query a holder's current credential status
      description: >
        Read-hot-path endpoint, served from credentials_cache with a short
        Redis TTL. Never blocks on a live chain call.
      security: []
      parameters:
        - name: holderAddress
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatus'
        '404':
          description: No credential on record

  /credentials/{holderAddress}/renew:
    post:
      summary: Renew an existing credential ahead of expiry
      parameters:
        - name: holderAddress
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                additionalSeconds:
                  type: integer
      responses:
        '200':
          description: Renewal transaction submitted
        '403':
          description: Caller is not the original issuer

  /credentials/{holderAddress}/revoke:
    post:
      summary: Revoke a holder's credential
      description: Callable by the issuer, governance, or an authorized monitor relay.
      parameters:
        - name: holderAddress
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Short code, e.g. MONITOR_FLAG, USER_REQUEST, ISSUER_ERROR
      responses:
        '200':
          description: Revocation transaction submitted
        '403':
          description: Caller not authorized

  /issuers:
    get:
      summary: List active issuers
      responses:
        '200':
          description: Issuer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issuer'

  /monitor/flags:
    post:
      summary: Ingest an anomaly flag from the monitoring agent
      description: >
        Internal endpoint, restricted to the monitoring service's own
        credentials. Not exposed to third-party issuers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorFlag'
      responses:
        '201':
          description: Flag recorded, auto-action evaluated

  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK

  /readyz:
    get:
      summary: Readiness probe, checks DB and chain-indexer lag
      security: []
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready, e.g. indexer lag exceeds threshold

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-BOTGUARD-Api-Key

  schemas:
    VerificationSubmission:
      type: object
      required: [holderAddress, tier, commitmentHash, validityPeriodSeconds]
      properties:
        holderAddress:
          type: string
        tier:
          type: string
          enum: [RETAIL, ACCREDITED, INSTITUTIONAL]
        jurisdiction:
          type: string
          minLength: 2
          maxLength: 2
        commitmentHash:
          type: string
          description: keccak256 hash of the off-chain verification record
        validityPeriodSeconds:
          type: integer

    VerificationRequestStatus:
      type: object
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [PENDING, IN_REVIEW, SIGNED, SUBMITTED, CONFIRMED, FAILED]
        txHash:
          type: string
        failureReason:
          type: string

    WalletStatus:
      type: object
      properties:
        holderAddress:
          type: string
        verified:
          type: boolean
          description: Live pass — not expired, not revoked, Retail or above
        kind:
          type: object
          nullable: true
          properties:
            tier:
              type: string
              enum: [RETAIL, ACCREDITED, INSTITUTIONAL]
            tierRank:
              type: integer
              description: 1 Retail, 2 Accredited, 3 Institutional
            jurisdiction:
              type: string
            label:
              type: string
              example: RETAIL · US
        meetsRequirement:
          type: boolean
        requirement:
          type: object
          properties:
            minTier:
              type: string
            jurisdiction:
              type: string
              nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
        badge:
          type: object
          nullable: true
          properties:
            contract:
              type: string
            tokenId:
              type: string
              nullable: true
            owned:
              type: boolean
        registry:
          type: string
        chainId:
          type: integer
        personalData:
          type: string
          example: off-chain

    CredentialStatus:
      type: object
      properties:
        holderAddress:
          type: string
        tier:
          type: string
        jurisdiction:
          type: string
        issuer:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
        valid:
          type: boolean
          description: Computed convenience field, false if expired/revoked/issuer inactive

    Issuer:
      type: object
      properties:
        address:
          type: string
        name:
          type: string
        trustTier:
          type: integer
        active:
          type: boolean

    MonitorFlag:
      type: object
      required: [holderAddress, flagType, severity]
      properties:
        holderAddress:
          type: string
        flagType:
          type: string
          enum: [STRUCTURING, RAPID_FRAGMENTATION, TIER_MISMATCH, VELOCITY_ANOMALY]
        severity:
          type: integer
          minimum: 1
          maximum: 5
        detail:
          type: object
