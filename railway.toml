# Railway service: BOTGUARD API
# In Railway: set Root Directory to repo root, Dockerfile path to services/api/Dockerfile
# Or use Nixpacks with start command: npm run api

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/api/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
